services:
  cli:
    build:
      context: .
      dockerfile: Dockerfile
    image: wvxbs/ghub-rgb-freestyle-injector:dev
    volumes:
      - ${PALETTES_DIR:-./palettes}:/input
      - ${LGHUB_DIR:-./lghub-data}:/lghub
      - ./.state:/state
    command:
      - sync
      - --input
      - /input
      - --db
      - /lghub/settings.db
      - --state
      - /state/state.json
      - --dry-run

  gui:
    build:
      context: .
      dockerfile: Dockerfile.gui
    image: wvxbs/ghub-rgb-freestyle-injector-gui:dev
    ports:
      - "${GHUB_GUI_PORT:-8080}:8080"
    environment:
      INPUT_DIR: /input
      LGHUB_DB: /lghub/settings.db
      STATE_PATH: /state/state.json
    volumes:
      - ${PALETTES_DIR:-./palettes}:/input
      - ${LGHUB_DIR:-./lghub-data}:/lghub
      - ./.state:/state
