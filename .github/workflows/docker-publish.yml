name: Publish Docker image

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  docker:
    name: Publish to Docker Hub
    runs-on: ubuntu-latest
    environment: DOCKERHUB_USERNAME
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN || vars.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: wvxbs
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: wvxbs/ghub-rgb-freestyle-injector
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.DOCKERHUB_TOKEN != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report skipped Docker Hub push
        if: env.DOCKERHUB_TOKEN == ''
        run: echo "DOCKERHUB_TOKEN is not configured; image was built but not pushed."
