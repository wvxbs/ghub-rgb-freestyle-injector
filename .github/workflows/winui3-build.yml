name: Build Windows app

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-winui:
    name: Build Windows artifact
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build bundled CLI
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller
          pyinstaller --noconfirm --onefile --console --name ghub-freestyle tools/cli_entry.py

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore WinUI project
        run: dotnet restore winui/GHubFreestyleInjector.WinUI/GHubFreestyleInjector.WinUI.csproj

      - name: Publish WinUI shell
        run: >
          dotnet publish winui/GHubFreestyleInjector.WinUI/GHubFreestyleInjector.WinUI.csproj
          -c Release
          -r win-x64
          -p:SelfContained=true
          -p:WindowsPackageType=None
          -o artifacts/GHubFreestyleInjector-WinUI3

      - name: Copy bundled CLI into artifact
        shell: pwsh
        run: Copy-Item dist/ghub-freestyle.exe artifacts/GHubFreestyleInjector-WinUI3/ghub-freestyle.exe

      - name: Sign Windows executables
        shell: pwsh
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: >
          ./scripts/sign-windows-artifact.ps1
          -ArtifactDir artifacts/GHubFreestyleInjector-WinUI3

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        env:
          GHUB_FREESTYLE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.1.0' }}
          GHUB_FREESTYLE_SOURCE_DIR: ${{ github.workspace }}\artifacts\GHubFreestyleInjector-WinUI3
          GHUB_FREESTYLE_INSTALLER_OUT: ${{ github.workspace }}\artifacts\installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/GHubFreestyleInjector.iss'

      - name: Sign Windows installer
        shell: pwsh
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: >
          ./scripts/sign-windows-artifact.ps1
          -ArtifactDir artifacts/GHubFreestyleInjector-WinUI3
          -ExtraTargets artifacts/installer/GHubFreestyleInjector-Setup-windows-x64.exe

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: GHubFreestyleInjector-Setup-windows-x64
          path: artifacts/installer/GHubFreestyleInjector-Setup-windows-x64.exe

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: GHubFreestyleInjector-WinUI3-windows-x64
          path: artifacts/GHubFreestyleInjector-WinUI3/**

      - name: Create portable release archive
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Compress-Archive `
            -Path artifacts/GHubFreestyleInjector-WinUI3/* `
            -DestinationPath artifacts/GHubFreestyleInjector-WinUI3-windows-x64.zip `
            -Force

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/installer/GHubFreestyleInjector-Setup-windows-x64.exe
            artifacts/GHubFreestyleInjector-WinUI3-windows-x64.zip
