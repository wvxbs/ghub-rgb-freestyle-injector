name: Build GUI artifacts

on:
push:
branches:
- feature/windows-gui
workflow_dispatch:

permissions:
contents: read

jobs:
windows-exe:
name: Build Windows executable
runs-on: windows-latest

```
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Install build dependencies
    run: |
      python -m pip install --upgrade pip
      python -m pip install .
      python -m pip install pyinstaller

  - name: Build executable
    run: |
      pyinstaller --noconfirm --onefile --windowed --name GHubFreestyleInjector --collect-all ghub_freestyle_injector tools/windows_gui_entry.py

  - name: Package artifact
    shell: pwsh
    run: |
      Compress-Archive `
        -Path dist/GHubFreestyleInjector.exe `
        -DestinationPath dist/GHubFreestyleInjector-windows-x64.zip

  - name: Upload executable artifact
    uses: actions/upload-artifact@v4
    with:
      name: GHubFreestyleInjector-windows-x64
      path: dist/GHubFreestyleInjector-windows-x64.zip
```

docker-gui:
name: Publish GUI container
runs-on: ubuntu-latest
environment: DOCKERHUB_USERNAME

```
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Set up Docker Buildx
    uses: docker/setup-buildx-action@v3

  - name: Log in to Docker Hub
    uses: docker/login-action@v3
    with:
      username: ${{ vars.DOCKERHUB_USERNAME }}
      password: ${{ vars.DOCKERHUB_TOKEN }}

  - name: Extract Docker metadata
    id: meta
    uses: docker/metadata-action@v5
    with:
      images: wvxbs/ghub-rgb-freestyle-injector-gui
      tags: |
        type=raw,value=feature-windows-gui
        type=ref,event=branch
        type=sha,prefix=gui-sha-

  - name: Build and push GUI image
    uses: docker/build-push-action@v6
    with:
      context: .
      file: Dockerfile.gui
      push: true
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      cache-from: type=gha
      cache-to: type=gha,mode=max
```
