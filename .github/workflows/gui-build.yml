name: Build GUI artifacts

on:
  push:
    branches:
      - feature/windows-gui
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --noconfirm --onefile --windowed --name GHubFreestyleInjector --collect-all ghub_freestyle_injector tools/windows_gui_entry.py

      - name: Package artifact
        shell: pwsh
        run: |
          Compress-Archive -Path dist/GHubFreestyleInjector.exe -DestinationPath dist/GHubFreestyleInjector-windows-x64.zip

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: GHubFreestyleInjector-windows-x64
          path: dist/GHubFreestyleInjector-windows-x64.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GHubFreestyleInjector-windows-x64.zip