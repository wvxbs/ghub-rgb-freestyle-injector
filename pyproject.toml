[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ghub-rgb-freestyle-injector"
version = "0.1.0"
description = "Sincroniza paletas RGB Markdown/JSON como presets Freestyle do Logitech G HUB."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "wvxbs" }]
license = { text = "MIT" }
dependencies = []

[project.scripts]
ghub-freestyle = "ghub_freestyle_injector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
